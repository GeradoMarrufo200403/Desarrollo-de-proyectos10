<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Matrix transformation - Premium Engine</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f111a;
            --panel-bg: rgba(20, 24, 39, 0.65);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-glow: rgba(0, 255, 170, 0.4);
            --text-main: #f0f4f8;
            --text-muted: #8c9baf;
            --slider-track: #2a2f4c;
            --slider-thumb: #00ffaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Glassmorphism Control Panel */
        .control-panel {
            position: absolute;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            width: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2rem;
            z-index: 10;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            transition: all 0.3s ease;
        }

        .control-panel::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, rgba(0, 255, 170, 0.2), rgba(0, 162, 255, 0.2));
            z-index: -1;
            border-radius: 26px;
            filter: blur(10px);
            opacity: 0.5;
        }

        .header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #ffffff, #00ffaa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #ff3366;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3366;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .status-dot.connected {
            background-color: #00ffaa;
            box-shadow: 0 0 8px #00ffaa;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .control-section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .slider-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .slider-value {
            color: var(--slider-thumb);
            font-family: monospace;
            font-size: 0.9rem;
        }

        /* Modern Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: var(--slider-track);
            border-radius: 3px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--slider-thumb);
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            margin-top: -5px;
            box-shadow: 0 0 10px var(--accent-glow);
            transition: transform 0.1s;
        }

        input[type=range]:active::-webkit-slider-thumb {
            transform: scale(1.3);
        }

        .reset-btn {
            background: rgba(0, 255, 170, 0.1);
            color: var(--slider-thumb);
            border: 1px solid rgba(0, 255, 170, 0.3);
            padding: 0.75rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .reset-btn:hover {
            background: rgba(0, 255, 170, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.3);
            transform: translateY(-1px);
        }

        .reset-btn:active {
            transform: translateY(1px);
        }

        /* Selector de Figuras 3D */
        .figure-selector-container {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .figure-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            background: rgba(15, 17, 26, 0.7);
            padding: 5px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .figure-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 0.65rem 0.25rem;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.75rem;
            font-weight: 500;
            user-select: none;
        }

        .figure-btn .fig-icon {
            font-size: 1.35rem;
            line-height: 1;
            transition: transform 0.25s ease;
        }

        .figure-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-1px);
        }

        .figure-btn:hover .fig-icon {
            transform: scale(1.15);
        }

        .figure-btn.active {
            background: rgba(0, 255, 170, 0.15);
            border-color: rgba(0, 255, 170, 0.5);
            color: #00ffaa;
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.25);
            font-weight: 600;
        }

        .figure-btn.active[data-figura="esfera"] {
            background: rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.5);
            color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.25);
        }

        .figure-btn.active[data-figura="piramide"] {
            background: rgba(255, 183, 0, 0.15);
            border-color: rgba(255, 183, 0, 0.5);
            color: #ffb700;
            box-shadow: 0 0 15px rgba(255, 183, 0, 0.25);
        }

        .figure-btn.active .fig-icon {
            transform: scale(1.2);
        }

        /* Loading overlay */
        #loading {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 255, 170, 0.2);
            border-top-color: var(--slider-thumb);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Cargando motor 3D y modelo...</p>
    </div>

    <div id="canvas-container"></div>

    <div class="control-panel">
        <div class="header">
            <h1>Matrix API Transform</h1>
            <div class="status">
                <div class="status-dot" id="ws-status"></div>
                <span id="ws-text">Conectando WebSocket...</span>
            </div>
            <div class="status" style="margin-top: 4px;">
                <span id="model-status" style="color: var(--text-muted);">Esperando datos de modelo...</span>
            </div>
        </div>

        <div class="control-group figure-selector-container">
            <div class="control-section-title">Figura 3D Activa</div>
            <div class="figure-grid" id="figure-grid">
                <button class="figure-btn active" data-figura="dona" id="btn-fig-dona" title="Toroide / Dona">
                    <span class="fig-icon">🍩</span>
                    <span class="fig-label">Dona</span>
                </button>
                <button class="figure-btn" data-figura="esfera" id="btn-fig-esfera" title="Esfera 3D">
                    <span class="fig-icon">🔮</span>
                    <span class="fig-label">Esfera</span>
                </button>
                <button class="figure-btn" data-figura="piramide" id="btn-fig-piramide" title="Pirámide 3D">
                    <span class="fig-icon">🔺</span>
                    <span class="fig-label">Pirámide</span>
                </button>
                <button class="figure-btn" data-figura="morph" id="btn-fig-morph" title="Morph Dona a Taza">
                    <span class="fig-icon">☕</span>
                    <span class="fig-label">Dona→Taza</span>
                </button>
            </div>
        </div>

        <div class="control-group" id="morph-panel" style="display: none;">
            <div class="control-section-title">Morph Topológico (Dona → Taza)</div>
            <div class="slider-wrapper">
                <div class="slider-header">
                    <span id="figura-etiqueta">Dona</span>
                    <span class="slider-value" id="val-morph-t">0%</span>
                </div>
                <input type="range" id="morph-t" min="0" max="1" step="0.02" value="0">
            </div>
            <div style="display: flex; gap: 0.5rem; margin-top: 0.25rem;">
                <input type="text" id="figura-nombre" maxlength="60" placeholder="Nombre de la figura..."
                    style="flex: 1; background: rgba(15,17,26,0.8); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 0.45rem 0.6rem; font-size: 0.8rem;">
                <button class="reset-btn" id="figura-guardar" style="margin-top: 0; padding: 0.45rem 0.75rem; font-size: 0.8rem;">Guardar</button>
            </div>
        </div>

        <div class="control-group">
            <div class="control-section-title">Traslación</div>
            <div class="slider-wrapper">
                <div class="slider-header"><span>Eje X</span><span class="slider-value" id="val-tx">0.00</span></div>
                <input type="range" id="tx" min="-10" max="10" step="0.1" value="0">
            </div>
            <div class="slider-wrapper">
                <div class="slider-header"><span>Eje Y</span><span class="slider-value" id="val-ty">0.00</span></div>
                <input type="range" id="ty" min="-10" max="10" step="0.1" value="0">
            </div>
            <div class="slider-wrapper">
                <div class="slider-header"><span>Eje Z</span><span class="slider-value" id="val-tz">0.00</span></div>
                <input type="range" id="tz" min="-10" max="10" step="0.1" value="0">
            </div>
        </div>

        <div class="control-group">
            <div class="control-section-title">Rotación (Grados)</div>
            <div class="slider-wrapper">
                <div class="slider-header"><span>Eje X</span><span class="slider-value" id="val-rx">0°</span></div>
                <input type="range" id="rx" min="-180" max="180" step="1" value="0">
            </div>
            <div class="slider-wrapper">
                <div class="slider-header"><span>Eje Y</span><span class="slider-value" id="val-ry">0°</span></div>
                <input type="range" id="ry" min="-180" max="180" step="1" value="0">
            </div>
            <div class="slider-wrapper">
                <div class="slider-header"><span>Eje Z</span><span class="slider-value" id="val-rz">0°</span></div>
                <input type="range" id="rz" min="-180" max="180" step="1" value="0">
            </div>
        </div>

        <button class="reset-btn" id="btn-reset">Resetear Transformaciones</button>
    </div>

    <!-- Three.js (using r128 for general stability) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. SETUP THREE.JS ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0f111a, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 25); // Moved back to see full 10 radius torus

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Grid y Axes ocultos por solicitud del usuario para dejar la figura flotando en el vacío.

        // Object Placeholder
        let modelGroup = new THREE.Group();
        modelGroup.matrixAutoUpdate = false;
        scene.add(modelGroup);
        
        let pointsMesh = null;

        // --- 2. MULTI-MODEL CONFIG & FETCH LOGIC ---
        const figureConfigs = {
            dona: { name: 'Dona (Toroide)', icon: '🍩', color: 0x00ffaa, hex: '#00ffaa', size: 0.15 },
            esfera: { name: 'Esfera', icon: '🔮', color: 0x00d4ff, hex: '#00d4ff', size: 0.14 },
            piramide: { name: 'Pirámide', icon: '🔺', color: 0xffb700, hex: '#ffb700', size: 0.16 },
            morph: { name: 'Morph Dona → Taza', icon: '☕', color: 0x00ffaa, hex: '#00ffaa', size: 0.15 }
        };
        let currentFigure = 'dona';
        let morphSavedName = null;

        function requestMorphVertices(tVal) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ morph: { t: parseFloat(tVal), resolucion: 60 } }));
        }

        async function fetchModelData(figura = 'dona') {
            const morphPanel = document.getElementById('morph-panel');
            if (figura === 'morph') {
                if (morphPanel) morphPanel.style.display = 'flex';
                const tVal = parseFloat(document.getElementById('morph-t').value || '0');
                requestMorphVertices(tVal);
                return;
            }
            if (morphPanel) morphPanel.style.display = 'none';
            const config = figureConfigs[figura] || figureConfigs['dona'];
            const modelStatus = document.getElementById('model-status');

            try {
                modelStatus.innerText = `Cargando ${config.name}...`;
                modelStatus.style.color = 'var(--text-muted)';

                const response = await fetch(`/api/modelo-csv?figura=${encodeURIComponent(figura)}`);
                if(!response.ok) throw new Error('API Response Error');
                const data = await response.json();

                if (data.vertices && data.vertices.length > 0) {
                    modelStatus.innerText = `${config.icon} ${config.name}: ${data.total_puntos.toLocaleString()} vértices`;
                    modelStatus.style.color = config.hex;
                    createPointsMesh(data.vertices, figura);
                } else {
                    modelStatus.innerText = `No se encontraron vértices para ${config.name}`;
                    modelStatus.style.color = '#ffaa00';
                }
            } catch (err) {
                console.error("Error fetching points:", err);
                modelStatus.innerText = "Error cargando figura.";
                modelStatus.style.color = '#ff3366';
            }

            // Hide loading overlay if visible
            const loadingEl = document.getElementById('loading');
            if (loadingEl && loadingEl.style.display !== 'none') {
                loadingEl.style.opacity = '0';
                setTimeout(() => loadingEl.style.display = 'none', 500);
            }
        }

        function createPointsMesh(verticesArray, figura = 'dona') {
            if (pointsMesh) {
                modelGroup.remove(pointsMesh);
                if (pointsMesh.geometry) pointsMesh.geometry.dispose();
                if (pointsMesh.material) pointsMesh.material.dispose();
            }

            const config = figureConfigs[figura] || figureConfigs['dona'];
            const geometry = new THREE.BufferGeometry();
            const vertices = new Float32Array(verticesArray.length * 3);
            
            for(let i=0; i < verticesArray.length; i++) {
                vertices[i*3] = verticesArray[i][0];
                vertices[i*3+1] = verticesArray[i][1];
                vertices[i*3+2] = verticesArray[i][2];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            
            // Material styled to look like glowing data points with figure-specific neon glow
            const material = new THREE.PointsMaterial({ 
                color: config.color, 
                size: config.size,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });
            
            pointsMesh = new THREE.Points(geometry, material);
            modelGroup.add(pointsMesh);
        }

        // Setup selector de figuras interactivo
        document.querySelectorAll('.figure-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetFig = btn.dataset.figura;
                if (targetFig === currentFigure) return;

                document.querySelectorAll('.figure-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                currentFigure = targetFig;
                fetchModelData(currentFigure);
            });
        });

        // Carga inicial
        fetchModelData(currentFigure);

        // --- 3. WEBSOCKET LOGIC ---
        let ws;
        const wsStatusDot = document.getElementById('ws-status');
        const wsText = document.getElementById('ws-text');

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/transform`;
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                wsStatusDot.classList.add('connected');
                wsText.innerText = "Conectado a API Transform";
                sendTransformData(); // Send initial state
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.morph && data.morph.vertices) {
                    createPointsMesh(data.morph.vertices, 'morph');
                    const pct = Math.round(data.morph.t * 100);
                    document.getElementById('val-morph-t').innerText = `${pct}%`;
                    const etiqueta = document.getElementById('figura-etiqueta');
                    if (morphSavedName) {
                        etiqueta.innerText = morphSavedName;
                    } else if (data.morph.t === 0) {
                        etiqueta.innerText = 'Dona';
                    } else if (data.morph.t === 1) {
                        etiqueta.innerText = 'Taza';
                    } else {
                        etiqueta.innerText = `Dona → Taza (${pct}%)`;
                    }
                    document.getElementById('model-status').innerText = `☕ ${etiqueta.innerText}: ${data.morph.vertices.length.toLocaleString()} vértices`;
                    return;
                }
                if (data.guardada && data.guardada.nombre) {
                    morphSavedName = data.guardada.nombre;
                    document.getElementById('figura-etiqueta').innerText = morphSavedName;
                    document.getElementById('model-status').innerText = `☕ Guardada: ${morphSavedName}`;
                    return;
                }
                if (data.matrix) {
                    // Convert Array to Matrix4 and apply it to the group
                    const m = new THREE.Matrix4();
                    m.fromArray(data.matrix); // Array must be 16 floats in Column-Major order
                    modelGroup.matrix.copy(m);
                }
            };

            ws.onclose = () => {
                wsStatusDot.classList.remove('connected');
                wsText.innerText = "Desconectado. Reconectando...";
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (err) => {
                console.error("WS Error:", err);
            };
        }

        connectWebSocket();

        // --- 4. UI CONTROLS ---
        const sliders = ['tx', 'ty', 'tz', 'rx', 'ry', 'rz'];
        
        function sendTransformData() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            const payload = {};
            sliders.forEach(id => {
                payload[id] = parseFloat(document.getElementById(id).value);
            });
            
            ws.send(JSON.stringify(payload));
        }

        sliders.forEach(id => {
            const input = document.getElementById(id);
            const valDisplay = document.getElementById(`val-${id}`);
            
            input.addEventListener('input', (e) => {
                let v = e.target.value;
                if (id.startsWith('r')) v += '°';
                else v = parseFloat(v).toFixed(2);
                
                valDisplay.innerText = v;
                sendTransformData();
            });
        });

        document.getElementById('morph-t').addEventListener('input', (e) => {
            morphSavedName = null;
            const tVal = parseFloat(e.target.value);
            document.getElementById('val-morph-t').innerText = `${Math.round(tVal * 100)}%`;
            requestMorphVertices(tVal);
        });

        document.getElementById('figura-guardar').addEventListener('click', () => {
            const nombre = document.getElementById('figura-nombre').value.trim();
            const tVal = parseFloat(document.getElementById('morph-t').value || '0');
            if (!nombre || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ guardar: { nombre: nombre, t: tVal, resolucion: 60 } }));
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            sliders.forEach(id => {
                const el = document.getElementById(id);
                el.value = 0;
                document.getElementById(`val-${id}`).innerText = id.startsWith('r') ? '0°' : '0.00';
            });
            sendTransformData();
            
            // Reset orbit controls
            controls.reset();
            camera.position.set(5, 5, 25);
        });


        // --- 5. RENDER LOOP ---
        let autoAngle = 0;
        function animate() {
            requestAnimationFrame(animate);
            
            // Movimiento automático de la figura
            if (ws && ws.readyState === WebSocket.OPEN) {
                autoAngle += 1; // Velocidad de rotación
                
                // Calculamos oscilación y rotación continua
                const newTx = Math.sin(autoAngle * 0.02) * 3; 
                
                let normRx = autoAngle % 360;
                if (normRx > 180) normRx -= 360;
                
                let normRy = (autoAngle * 0.6) % 360;
                if (normRy > 180) normRy -= 360;
                
                // Movemos los sliders mágicamente (Glassmorphism animado)
                document.getElementById('tx').value = newTx;
                document.getElementById('val-tx').innerText = newTx.toFixed(2);
                
                document.getElementById('rx').value = normRx;
                document.getElementById('val-rx').innerText = normRx.toFixed(0) + '°';
                
                document.getElementById('ry').value = normRy;
                document.getElementById('val-ry').innerText = normRy.toFixed(0) + '°';
                
                sendTransformData();
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
