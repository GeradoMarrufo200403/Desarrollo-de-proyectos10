services:
  calculadora:
    build: ./calculadora_matrices
    ports:
      - "8001:8000"
    volumes:
      - ./calculadora_matrices:/app

  modelo3d:
    build: ./modelo-3D
    ports:
      - "8000:8000"
    volumes:
      - ./modelo-3D:/app
    environment:
      - PYTHONUNBUFFERED=1
      - CALC_URL=http://calculadora:8000
    depends_on:
      - calculadora
